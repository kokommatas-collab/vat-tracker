<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Θέση ΦΠΑ</title>
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ΦΠΑ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="script.js"></script>
</head>
<body>
  <main>
    <section id="login" hidden>
      <h1>Θέση ΦΠΑ</h1>
      <form id="login-form">
        <label>Email <input type="email" name="email" autocomplete="username" required></label>
        <label>Κωδικός <input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit">Σύνδεση</button>
        <p class="error" id="login-error" hidden></p>
      </form>
    </section>

    <section id="app" hidden>
      <header>
        <select id="quarter" aria-label="Τρίμηνο"></select>
        <button id="logout" class="link" type="button">Έξοδος</button>
      </header>

      <div class="card" id="result">
        <span class="badge">Εκτίμηση</span>
        <div class="kind" id="kind">—</div>
        <div class="amount" id="amount">—</div>
      </div>

      <dl class="lines">
        <div><dt>Φόρος εκροών</dt><dd id="out-vat">—</dd></div>
        <div><dt>Φόρος εισροών</dt><dd id="in-vat">—</dd></div>
        <div>
          <dt>Πιστωτικό προηγ. περιόδου
            <button id="edit-credit" class="link" type="button" aria-label="Αλλαγή πιστωτικού">✎</button>
          </dt>
          <dd id="credit">—</dd>
        </div>
      </dl>

      <p class="meta" id="last-update"></p>
      <p class="meta" id="unclassified" hidden></p>
      <p class="meta warn" id="warning" hidden></p>
      <p class="error" id="sync-error" hidden></p>

      <button id="refresh" type="button">Ανανέωση</button>
    </section>
  </main>
</body>
</html>
